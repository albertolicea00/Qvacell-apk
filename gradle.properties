org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP still registers its generated-sources dir via the legacy kotlin.sourceSets DSL, which AGP
# 9's built-in Kotlin support rejects by default (see https://developer.android.com/r/tools/built-in-kotlin).
android.disallowKotlinSourceSets=false
